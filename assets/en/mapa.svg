<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="mapa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FE3FF"/>
      <stop offset="45%" stop-color="#39C2FF"/>
      <stop offset="55%" stop-color="#1E6BFF"/>
      <stop offset="100%" stop-color="#7A3BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.022"/>
    </pattern>

    <clipPath id="clip"><rect width="880" height="210" rx="14"/></clipPath>
  </defs>
  <style>
    .lbl { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; letter-spacing: 3px; fill: #6B7A99; }
    .hdr { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 17px; letter-spacing: 4px; fill: #7FE7C4; }
    .big { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 2px; fill: url(#chrome); }
    .body { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; fill: #C9D4E8; }
    .dim  { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #6B7A99; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-900px); }
      55%  { transform: translateX(900px); }
      100% { transform: translateX(900px); }
    }
    /* Quien pidio menos movimiento ve el panel quieto. Apagar la animacion no
       alcanza: varios elementos arrancan invisibles y solo aparecen al animarse,
       asi que hay que fijarles el estado de reposo o el panel queda vacio.
       No se toca la opacidad en general, porque muchas formas dependen de una
       opacidad parcial deliberada. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .letter, .plane, .chk, .note, .mus,
      .l0, .l1, .l2 { opacity: 1 !important; }
      .trace { stroke-dashoffset: 0 !important; }
      .sub { opacity: 0 !important; }
      .sub.s0 { opacity: 1 !important; }
    }

    .stop { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px;
            letter-spacing: 2px; fill: #C9D4E8; text-anchor: middle; }
    .yr   { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px;
            fill: #6B7A99; text-anchor: middle; }
    .route { stroke-dasharray: 6 7; animation: march 2.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -26; } }
    .plane { animation: fly 9s ease-in-out infinite; }
    @keyframes fly {
      0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; }
      88% { opacity: 1; } 100% { transform: translateX(630px); opacity: 0; }
    }
    .pulse { animation: ring 2s ease-out infinite; }
    @keyframes ring { 0% { r: 7; opacity: .9; } 100% { r: 20; opacity: 0; } }
    </style>

  <rect width="880" height="210" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="877" height="207" rx="13" fill="none" stroke="#2A3550" stroke-width="3"/>
  <rect x="13" y="13" width="854" height="184" rx="8" fill="none" stroke="#1B2437" stroke-width="1.5"/>
  <g fill="#FFD166" opacity="0.7"><circle cx="34" cy="26" r="2.5"/><circle cx="62" cy="26" r="2.5"/><circle cx="818" cy="26" r="2.5"/><circle cx="846" cy="26" r="2.5"/></g>

  <text class="hdr" x="34" y="44">THE RUN</text><line class="route" x1="130" y1="108" x2="760" y2="108" stroke="#2A3550" stroke-width="2"/><circle cx="130" cy="108" r="7" fill="#39C2FF" opacity="0.18"/><circle cx="130" cy="108" r="4" fill="#39C2FF"/><text class="stop" x="130" y="88">MENDOZA</text><text class="yr" x="130" y="136">2020</text><circle cx="350" cy="108" r="7" fill="#39C2FF" opacity="0.18"/><circle cx="350" cy="108" r="4" fill="#39C2FF"/><text class="stop" x="350" y="88">MERCADO LIBRE</text><text class="yr" x="350" y="136">2021</text><circle cx="570" cy="108" r="7" fill="#39C2FF" opacity="0.18"/><circle cx="570" cy="108" r="4" fill="#39C2FF"/><text class="stop" x="570" y="88">DUBLIN</text><text class="yr" x="570" y="136">2025</text><circle cx="760" cy="108" r="7" fill="#FFD166" opacity="0.18"/><circle cx="760" cy="108" r="4" fill="#FFD166"/><text class="stop" x="760" y="88">LEVRY</text><text class="yr" x="760" y="136">now</text><circle class="pulse" cx="760" cy="108" r="7" fill="none" stroke="#FFD166" stroke-width="2"/><g class="plane"><path transform="translate(122,96)" d="M0 8 L20 2 L17 9 L20 16 Z" fill="#7FE7C4" opacity="0.95"/></g><text class="dim" x="34" y="176">11,000 km, four stops and a new language.</text>

  <rect width="880" height="210" rx="14" fill="url(#scan)"/>
  <g clip-path="url(#clip)">
    <rect class="sweep" x="0" y="0" width="150" height="210" fill="#8FE3FF" opacity="0.04"/>
  </g>
</svg>
