<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="ch4 escala">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FE3FF"/>
      <stop offset="45%" stop-color="#39C2FF"/>
      <stop offset="55%" stop-color="#1E6BFF"/>
      <stop offset="100%" stop-color="#7A3BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.022"/>
    </pattern>

    <clipPath id="clip"><rect width="880" height="200" rx="14"/></clipPath>
  </defs>
  <style>
    .lbl { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; letter-spacing: 3px; fill: #6B7A99; }
    .hdr { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 17px; letter-spacing: 4px; fill: #7FE7C4; }
    .big { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 2px; fill: url(#chrome); }
    .body { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; fill: #C9D4E8; }
    .dim  { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #6B7A99; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-900px); }
      55%  { transform: translateX(900px); }
      100% { transform: translateX(900px); }
    }
    /* Quien pidio menos movimiento ve el panel quieto. Apagar la animacion no
       alcanza: varios elementos arrancan invisibles y solo aparecen al animarse,
       asi que hay que fijarles el estado de reposo o el panel queda vacio.
       No se toca la opacidad en general, porque muchas formas dependen de una
       opacidad parcial deliberada. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .letter, .plane, .chk, .note, .mus,
      .l0, .l1, .l2 { opacity: 1 !important; }
      .trace { stroke-dashoffset: 0 !important; }
      .sub { opacity: 0 !important; }
      .sub.s0 { opacity: 1 !important; }
    }

    .alert { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .trace { stroke-dasharray: 700; stroke-dashoffset: 700;
             animation: draw 4.5s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 700; } 60% { stroke-dashoffset: 0; }
                      95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 700; } }
    </style>

  <rect width="880" height="200" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="877" height="197" rx="13" fill="none" stroke="#2A3550" stroke-width="3"/>
  <rect x="13" y="13" width="854" height="174" rx="8" fill="none" stroke="#1B2437" stroke-width="1.5"/>
  <g fill="#FFD166" opacity="0.7"><circle cx="34" cy="26" r="2.5"/><circle cx="62" cy="26" r="2.5"/><circle cx="818" cy="26" r="2.5"/><circle cx="846" cy="26" r="2.5"/></g>

  <text class="hdr" x="34" y="44">CAP&#205;TULO 4 / ESCALA</text><g class="alert"><circle cx="746" cy="39" r="5" fill="#FF5C7A"/></g><text class="dim" x="762" y="44">03:14 AM</text><g transform="translate(34,64)"><rect width="500" height="90" rx="6" fill="#161B27" stroke="#2A3550"/><polyline class="trace" points="0,60 40,58 80,61 120,57 160,59 200,56 240,50 280,36 320,42 360,22 400,8 440,14 470,2" fill="none" stroke="#FF5C7A" stroke-width="2" transform="translate(14,4)"/><text class="dim" x="14" y="82">p99 latency</text></g><text class="body" x="560" y="90">cuando hay millones</text><text class="body" x="560" y="112">del otro lado, el dise&#241;o</text><text class="body" x="560" y="134">deja de ser te&#243;rico.</text>

  <rect width="880" height="200" rx="14" fill="url(#scan)"/>
  <g clip-path="url(#clip)">
    <rect class="sweep" x="0" y="0" width="150" height="200" fill="#8FE3FF" opacity="0.04"/>
  </g>
</svg>
