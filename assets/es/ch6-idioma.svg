<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="ch6 idioma">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FE3FF"/>
      <stop offset="45%" stop-color="#39C2FF"/>
      <stop offset="55%" stop-color="#1E6BFF"/>
      <stop offset="100%" stop-color="#7A3BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.022"/>
    </pattern>

    <clipPath id="clip"><rect width="880" height="210" rx="14"/></clipPath>
  </defs>
  <style>
    .lbl { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; letter-spacing: 3px; fill: #6B7A99; }
    .hdr { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 17px; letter-spacing: 4px; fill: #7FE7C4; }
    .big { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 2px; fill: url(#chrome); }
    .body { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; fill: #C9D4E8; }
    .dim  { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #6B7A99; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-900px); }
      55%  { transform: translateX(900px); }
      100% { transform: translateX(900px); }
    }
    /* Quien pidio menos movimiento ve el panel quieto. Apagar la animacion no
       alcanza: varios elementos arrancan invisibles y solo aparecen al animarse,
       asi que hay que fijarles el estado de reposo o el panel queda vacio.
       No se toca la opacidad en general, porque muchas formas dependen de una
       opacidad parcial deliberada. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .letter, .plane, .chk, .note, .mus,
      .l0, .l1, .l2 { opacity: 1 !important; }
      .trace { stroke-dashoffset: 0 !important; }
      .sub { opacity: 0 !important; }
      .sub.s0 { opacity: 1 !important; }
    }

    .sub { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 19px;
           fill: #C9D4E8; opacity: 0; animation: cycle 13s ease-in-out infinite; }
    .s0 { animation-delay: 0s; } .s1 { animation-delay: 3.25s; }
    .s2 { animation-delay: 6.5s; } .s3 { animation-delay: 9.75s; }
    @keyframes cycle { 0% { opacity: 0; } 4%,21% { opacity: 1; }
                       25% { opacity: 0; } 100% { opacity: 0; } }
    .bar { transform-origin: 34px 0; animation: creep 13s ease-out infinite; }
    @keyframes creep { 0% { transform: scaleX(.42); } 92% { transform: scaleX(.78); }
                       100% { transform: scaleX(.42); } }
    </style>

  <rect width="880" height="210" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="877" height="207" rx="13" fill="none" stroke="#2A3550" stroke-width="3"/>
  <rect x="13" y="13" width="854" height="184" rx="8" fill="none" stroke="#1B2437" stroke-width="1.5"/>
  <g fill="#FFD166" opacity="0.7"><circle cx="34" cy="26" r="2.5"/><circle cx="62" cy="26" r="2.5"/><circle cx="818" cy="26" r="2.5"/><circle cx="846" cy="26" r="2.5"/></g>

  <text class="hdr" x="34" y="44">CAP&#205;TULO 6 / EL IDIOMA</text><text class="sub s0" x="440" y="112" text-anchor="middle">Sorry, could you say that again?</text><text class="sub s1" x="440" y="112" text-anchor="middle">Grand, thanks a million.</text><text class="sub s2" x="440" y="112" text-anchor="middle">What's the craic?</text><text class="sub s3" x="440" y="112" text-anchor="middle">...sorry, one more time?</text><rect x="34" y="146" width="812" height="8" rx="4" fill="#161B27" stroke="#2A3550"/><rect class="bar" x="34" y="146" width="812" height="8" rx="4" fill="#7FE7C4" opacity="0.8"/><text class="dim" x="34" y="180">nivel de ingl&#233;s: en progreso, y probablemente para siempre</text>

  <rect width="880" height="210" rx="14" fill="url(#scan)"/>
  <g clip-path="url(#clip)">
    <rect class="sweep" x="0" y="0" width="150" height="210" fill="#8FE3FF" opacity="0.04"/>
  </g>
</svg>
