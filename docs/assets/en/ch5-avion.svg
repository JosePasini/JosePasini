<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="ch5 avion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FE3FF"/>
      <stop offset="45%" stop-color="#39C2FF"/>
      <stop offset="55%" stop-color="#1E6BFF"/>
      <stop offset="100%" stop-color="#7A3BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.022"/>
    </pattern>

    <clipPath id="clip"><rect width="880" height="240" rx="14"/></clipPath>
  </defs>
  <style>
    .lbl { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; letter-spacing: 3px; fill: #6B7A99; }
    .hdr { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 17px; letter-spacing: 4px; fill: #7FE7C4; }
    .big { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 2px; fill: url(#chrome); }
    .body { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; fill: #C9D4E8; }
    .dim  { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #6B7A99; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-900px); }
      55%  { transform: translateX(900px); }
      100% { transform: translateX(900px); }
    }
    /* Quien pidio menos movimiento ve el panel quieto. Apagar la animacion no
       alcanza: varios elementos arrancan invisibles y solo aparecen al animarse,
       asi que hay que fijarles el estado de reposo o el panel queda vacio.
       No se toca la opacidad en general, porque muchas formas dependen de una
       opacidad parcial deliberada. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .letter, .plane, .chk, .note, .mus,
      .l0, .l1, .l2 { opacity: 1 !important; }
      .trace { stroke-dashoffset: 0 !important; }
      .sub { opacity: 0 !important; }
      .sub.s0 { opacity: 1 !important; }
    }

    .path { stroke-dasharray: 5 8; animation: march 2.6s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -26; } }
    .plane { offset-path: path("M 70 190 Q 440 70 810 165"); offset-rotate: auto;
             animation: fly 8s ease-in-out infinite; }
    @keyframes fly { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; }
                     90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    .drop { animation: fall 1.1s linear infinite; }
    .d0 { animation-delay: 0s; } .d1 { animation-delay: .28s; }
    .d2 { animation-delay: .55s; } .d3 { animation-delay: .82s; }
    @keyframes fall { 0% { transform: translateY(0); opacity: .55; }
                      100% { transform: translateY(58px); opacity: 0; } }
    </style>

  <rect width="880" height="240" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="877" height="237" rx="13" fill="none" stroke="#2A3550" stroke-width="3"/>
  <rect x="13" y="13" width="854" height="214" rx="8" fill="none" stroke="#1B2437" stroke-width="1.5"/>
  <g fill="#FFD166" opacity="0.7"><circle cx="34" cy="26" r="2.5"/><circle cx="62" cy="26" r="2.5"/><circle cx="818" cy="26" r="2.5"/><circle cx="846" cy="26" r="2.5"/></g>

  <text class="hdr" x="34" y="44">CHAPTER 5 / THE PLANE</text><path class="path" d="M 70 190 Q 440 70 810 165" fill="none" stroke="#2A3550" stroke-width="2"/><g class="plane"><path d="M-10 -6 L10 0 L-10 6 L-6 0 Z" fill="#7FE7C4"/></g><circle cx="70" cy="190" r="4" fill="#FFD166"/><text class="dim" x="70" y="212" text-anchor="middle">Mendoza</text><circle cx="810" cy="165" r="4" fill="#39C2FF"/><text class="dim" x="810" y="187" text-anchor="middle">Dublin</text><g transform="translate(0,66)"><line class="drop d0" x1="596" y1="0" x2="593" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d1" x1="613" y1="0" x2="610" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d2" x1="630" y1="0" x2="627" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d3" x1="647" y1="0" x2="644" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d0" x1="664" y1="0" x2="661" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d1" x1="681" y1="0" x2="678" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d2" x1="698" y1="0" x2="695" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d3" x1="715" y1="0" x2="712" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d0" x1="732" y1="0" x2="729" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d1" x1="749" y1="0" x2="746" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d2" x1="766" y1="0" x2="763" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/><line class="drop d3" x1="783" y1="0" x2="780" y2="13" stroke="#39C2FF" stroke-width="1.4" opacity="0.5"/></g><text class="body" x="180" y="84">Moving country turns you</text><text class="body" x="180" y="106">back into a beginner.</text><text class="dim" x="180" y="128">Not at code: at everything else.</text>

  <rect width="880" height="240" rx="14" fill="url(#scan)"/>
  <g clip-path="url(#clip)">
    <rect class="sweep" x="0" y="0" width="150" height="240" fill="#8FE3FF" opacity="0.04"/>
  </g>
</svg>
