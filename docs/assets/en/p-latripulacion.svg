<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 215" width="880" height="215" role="img" aria-label="p latripulacion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FE3FF"/>
      <stop offset="45%" stop-color="#39C2FF"/>
      <stop offset="55%" stop-color="#1E6BFF"/>
      <stop offset="100%" stop-color="#7A3BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.022"/>
    </pattern>

    <clipPath id="clip"><rect width="880" height="215" rx="14"/></clipPath>
  </defs>
  <style>
    .lbl { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; letter-spacing: 3px; fill: #6B7A99; }
    .hdr { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 17px; letter-spacing: 4px; fill: #7FE7C4; }
    .big { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 2px; fill: url(#chrome); }
    .body { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; fill: #C9D4E8; }
    .dim  { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #6B7A99; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-900px); }
      55%  { transform: translateX(900px); }
      100% { transform: translateX(900px); }
    }
    /* Quien pidio menos movimiento ve el panel quieto. Apagar la animacion no
       alcanza: varios elementos arrancan invisibles y solo aparecen al animarse,
       asi que hay que fijarles el estado de reposo o el panel queda vacio.
       No se toca la opacidad en general, porque muchas formas dependen de una
       opacidad parcial deliberada. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .letter, .plane, .chk, .note, .mus,
      .l0, .l1, .l2 { opacity: 1 !important; }
      .trace { stroke-dashoffset: 0 !important; }
      .sub { opacity: 0 !important; }
      .sub.s0 { opacity: 1 !important; }
    }

    .tok { animation: hop 6s steps(1) infinite; }
    @keyframes hop { 0% { transform: translate(0,0); } 16% { transform: translate(40px,0); }
      32% { transform: translate(80px,0); } 48% { transform: translate(120px,0); }
      64% { transform: translate(160px,0); } 80% { transform: translate(200px,0); }
      100% { transform: translate(240px,0); } }
    .die { animation: roll 6s ease-in-out infinite; }
    @keyframes roll { 0%,100% { transform: rotate(0deg); } 12% { transform: rotate(96deg); }
                      24% { transform: rotate(-12deg); } }
    </style>

  <rect width="880" height="215" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="877" height="212" rx="13" fill="none" stroke="#2A3550" stroke-width="3"/>
  <rect x="13" y="13" width="854" height="189" rx="8" fill="none" stroke="#1B2437" stroke-width="1.5"/>
  <g fill="#FFD166" opacity="0.7"><circle cx="34" cy="26" r="2.5"/><circle cx="62" cy="26" r="2.5"/><circle cx="818" cy="26" r="2.5"/><circle cx="846" cy="26" r="2.5"/></g>

  <text class="hdr" x="34" y="44">PROJECT / LA TRIPULACI&#211;N</text><rect x="34" y="70" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="74" y="70" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="114" y="70" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="154" y="70" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="194" y="70" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="234" y="70" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="274" y="70" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="34" y="110" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="74" y="110" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="114" y="110" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="154" y="110" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="194" y="110" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="234" y="110" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="274" y="110" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="34" y="150" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="74" y="150" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="114" y="150" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="154" y="150" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="194" y="150" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="234" y="150" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><rect x="274" y="150" width="34" height="34" rx="4" fill="#161B27" stroke="#2A3550"/><g class="tok"><circle cx="51" cy="87" r="10" fill="#FFD166"/></g><g transform="translate(360,92)"><g class="die"><rect x="-17" y="-17" width="34" height="34" rx="6" fill="#1B2437" stroke="#7FE7C4"/><circle cx="-7" cy="-7" r="2.6" fill="#7FE7C4"/><circle cx="7" cy="7" r="2.6" fill="#7FE7C4"/><circle cx="0" cy="0" r="2.6" fill="#7FE7C4"/></g></g><text class="body" x="420" y="88">a board game in Python</text><text class="dim" x="420" y="110">the subject did not ask</text><text class="dim" x="420" y="132">if it worked, but how</text><text class="dim" x="420" y="154">you knew it worked.</text>

  <rect width="880" height="215" rx="14" fill="url(#scan)"/>
  <g clip-path="url(#clip)">
    <rect class="sweep" x="0" y="0" width="150" height="215" fill="#8FE3FF" opacity="0.04"/>
  </g>
</svg>
