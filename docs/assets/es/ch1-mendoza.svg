<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="ch1 mendoza">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121721"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FE3FF"/>
      <stop offset="45%" stop-color="#39C2FF"/>
      <stop offset="55%" stop-color="#1E6BFF"/>
      <stop offset="100%" stop-color="#7A3BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.022"/>
    </pattern>

    <clipPath id="clip"><rect width="880" height="200" rx="14"/></clipPath>
  </defs>
  <style>
    .lbl { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; letter-spacing: 3px; fill: #6B7A99; }
    .hdr { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 17px; letter-spacing: 4px; fill: #7FE7C4; }
    .big { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 2px; fill: url(#chrome); }
    .body { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 13px; fill: #C9D4E8; }
    .dim  { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #6B7A99; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-900px); }
      55%  { transform: translateX(900px); }
      100% { transform: translateX(900px); }
    }
    /* Quien pidio menos movimiento ve el panel quieto. Apagar la animacion no
       alcanza: varios elementos arrancan invisibles y solo aparecen al animarse,
       asi que hay que fijarles el estado de reposo o el panel queda vacio.
       No se toca la opacidad en general, porque muchas formas dependen de una
       opacidad parcial deliberada. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .letter, .plane, .chk, .note, .mus,
      .l0, .l1, .l2 { opacity: 1 !important; }
      .trace { stroke-dashoffset: 0 !important; }
      .sub { opacity: 0 !important; }
      .sub.s0 { opacity: 1 !important; }
    }

    .sun { animation: spin 26s linear infinite; transform-origin: 0 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .heat { animation: wobble 3.4s ease-in-out infinite; }
    @keyframes wobble { 0%,100% { opacity: .25; } 50% { opacity: .6; } }
    .tab { animation: tabs 4s ease-in-out infinite; }
    @keyframes tabs { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>

  <rect width="880" height="200" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="877" height="197" rx="13" fill="none" stroke="#2A3550" stroke-width="3"/>
  <rect x="13" y="13" width="854" height="174" rx="8" fill="none" stroke="#1B2437" stroke-width="1.5"/>
  <g fill="#FFD166" opacity="0.7"><circle cx="34" cy="26" r="2.5"/><circle cx="62" cy="26" r="2.5"/><circle cx="818" cy="26" r="2.5"/><circle cx="846" cy="26" r="2.5"/></g>

  <text class="hdr" x="34" y="44">CAP&#205;TULO 1 / MENDOZA, 2020</text><text class="big" x="34" y="92">40 grados</text><text class="dim" x="34" y="122">un ventilador m&#225;s ruidoso que &#250;til</text><text class="dim" x="34" y="142">23 pesta&#241;as abiertas</text><g transform="translate(482,58)"><g class="sun"><line x1="0" y1="0" x2="0" y2="-26" stroke="#FFD166" stroke-width="2" opacity="0.55" transform="rotate(0)"/><line x1="0" y1="0" x2="0" y2="-26" stroke="#FFD166" stroke-width="2" opacity="0.55" transform="rotate(45)"/><line x1="0" y1="0" x2="0" y2="-26" stroke="#FFD166" stroke-width="2" opacity="0.55" transform="rotate(90)"/><line x1="0" y1="0" x2="0" y2="-26" stroke="#FFD166" stroke-width="2" opacity="0.55" transform="rotate(135)"/><line x1="0" y1="0" x2="0" y2="-26" stroke="#FFD166" stroke-width="2" opacity="0.55" transform="rotate(180)"/><line x1="0" y1="0" x2="0" y2="-26" stroke="#FFD166" stroke-width="2" opacity="0.55" transform="rotate(225)"/><line x1="0" y1="0" x2="0" y2="-26" stroke="#FFD166" stroke-width="2" opacity="0.55" transform="rotate(270)"/><line x1="0" y1="0" x2="0" y2="-26" stroke="#FFD166" stroke-width="2" opacity="0.55" transform="rotate(315)"/></g><circle r="11" fill="#FFD166" opacity="0.9"/></g><path d="M 520 150 L 570 104 L 600 126 L 645 84 L 690 128 L 725 110 L 780 150 Z" fill="#1B2437" stroke="#2A3550" stroke-width="1.5"/><g class="heat"><path d="M 520 158 q 30 -6 60 0 t 60 0 t 60 0 t 60 0" fill="none" stroke="#7FE7C4" stroke-width="1.5"/></g><g transform="translate(372,104)"><rect width="120" height="42" rx="4" fill="#161B27" stroke="#2A3550"/><g class="tab" fill="#39C2FF"><rect x="7" y="7" width="16" height="5" rx="2"/><rect x="27" y="7" width="16" height="5" rx="2"/><rect x="47" y="7" width="16" height="5" rx="2"/><rect x="67" y="7" width="16" height="5" rx="2"/><rect x="87" y="7" width="16" height="5" rx="2"/></g><rect x="7" y="20" width="70" height="3" rx="1" fill="#2A3550"/><rect x="7" y="28" width="96" height="3" rx="1" fill="#2A3550"/></g>

  <rect width="880" height="200" rx="14" fill="url(#scan)"/>
  <g clip-path="url(#clip)">
    <rect class="sweep" x="0" y="0" width="150" height="200" fill="#8FE3FF" opacity="0.04"/>
  </g>
</svg>
